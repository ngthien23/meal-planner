[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner"
version = "0.1.0"
description = "AI Meal & Grocery Planner Agent running with Gemini API key and agents-cli"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.0",
    "google-adk>=2.11.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1; platform_system == 'Windows'"
]

[project.scripts]
meal-planner = "meal_planner.cli:run_interactive_cli"

[tool.setuptools.packages.find]
include = ["meal_planner*"]
